@for (window of windows(); track window) {
  <mg-window
    [isOpen]="true"
    [component]="window"
    [resizerHost]="this"
    [focus]="window.focus"
    (mousedown)="select(window)"
    (closed)="remove(window)"
    (minimized)="onWindowMinimize(window)"
    (restored)="onWindowRestore(window)"
    (focused)="onWindowFocus(window)"
  />
}

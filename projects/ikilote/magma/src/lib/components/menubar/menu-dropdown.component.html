@for (item of items(); track $index) {
  @if (item.separator) {
    <div class="mg-menu-separator" role="separator"></div>
  } @else {
    <button
      #itemRef
      class="mg-menu-item"
      type="button"
      role="menuitem"
      [class.disabled]="item.disabled"
      [class.has-children]="item.children?.length"
      [class.active-submenu]="activeSubMenu === item"
      [attr.disabled]="item.disabled ? true : null"
      [attr.aria-haspopup]="item.children?.length ? 'menu' : null"
      [attr.aria-expanded]="item.children?.length ? activeSubMenu === item : null"
      (click)="select(item, itemRef)"
      (mouseenter)="!pointerMode.isKeyboard() && (item.children?.length ? select(item, itemRef) : closeSubMenu())"
      (keydown.enter)="select(item, itemRef)"
      (keydown.space)="$event.preventDefault(); select(item, itemRef)"
    >
      @if (item.icon) {
        <span class="mg-menu-item-icon" aria-hidden="true">
          @if (isIconUrl(item.icon)) {
            <img [src]="item.icon" alt="" />
          } @else {
            {{ item.icon }}
          }
        </span>
      }
      <div class="mg-menu-item-content">
        <span class="mg-menu-item-label">{{ item.label }}</span>
        @if (item.children?.length) {
          <span class="mg-menu-item-arrow" aria-hidden="true">▶</span>
        }
      </div>
    </button>
  }
}
